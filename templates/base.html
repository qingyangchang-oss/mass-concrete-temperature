<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ConcreteAI - Mass Concrete Temperature Modeling{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232563eb'/><text x='50' y='65' font-size='50' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>C</text></svg>">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <div class="brand-icon">C</div>
            <div>
                <a href="/">ConcreteAI</a>
                <div class="brand-subtitle">Temperature Modeling</div>
            </div>
        </div>
        <div class="nav-links">
            <a href="/">Dashboard</a>
            <a href="/projects/new">New Project</a>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p><span class="brand-name">ConcreteAI</span> - Mass Concrete Temperature Modeling Platform</p>
        <p style="margin-top: 0.5rem; opacity: 0.7; font-size: 0.8rem;">Predictive analytics for thermal crack prevention</p>
    </footer>

    <script src="/static/js/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
